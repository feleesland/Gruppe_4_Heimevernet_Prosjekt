name: Test build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dotnet setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Heimevernet_Prosjekt.slnx 

      - name: Build
        run: dotnet build Heimevernet_Prosjekt.slnx

      - name: Test
        run: dotnet test Heimevernet_Prosjekt.slnx --configuration Release --no-build --no-restore --verbosity normal